<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Boipoka Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali&family=Hind+Siliguri&family=Tiro+Bangla&family=Mukta&family=Galada&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; }
  #viewer { min-height: 100%; }
  ::selection { background: #b3d4ff; }
</style>
</head>
<body>
<div id="viewer"></div>
<script>/* Reader bootstrap (browser context).
 * Web -> RN: window.ReactNativeWebView.postMessage(JSON.stringify(msg))
 * RN -> Web: window.__boipoka.init / applySettings / goto (injected via injectJavaScript)
 */
(function () {
  window.__boipokaError = function(msg) {
    try {
      var el = document.getElementById('viewer');
      if (el) {
        el.innerHTML = '<div style="padding:20px;font-family:sans-serif;color:#d9534f;"><h2>Reader error</h2><p>' + msg + '</p></div>';
      }
    } catch (e) {}
  };

  var chapters = [];
  var hrefs = [];
  var current = 0;
  var container = null;
  var state = 'booting'; // booting | ready | error

  function post(msg) {
    try {
      if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      }
    } catch (e) {}
  }

  function findContainer() {
    try {
      container = document.getElementById('viewer');
    } catch (e) {
      container = null;
    }
    return !!container;
  }

  function renderChapter(index) {
    if (index < 0 || index >= chapters.length) return;
    current = index;
    var ch = chapters[index];
    if (!container) {
      findContainer();
      if (!container) {
        post({ type: 'error', message: 'viewer container missing' });
        return;
      }
    }
    try {
      post({ type: 'debug', message: 'rendering chapter ' + (index + 1) + '/' + chapters.length });
      container.innerHTML = '<article style="display:block;color:inherit;">' + ch + '</article>';
      post({ type: 'ready', chapter: index + 1, total: chapters.length });
      state = 'ready';
    } catch (e) {
      post({ type: 'error', message: 'render: ' + e.message });
      state = 'error';
    }
  }

  function init(payload) {
    try {
      post({ type: 'debug', message: 'init called with ' + (payload.chapters || []).length + ' chapters' });
      // Show loading state
      try {
        var viewer = document.getElementById('viewer');
        if (viewer) {
          viewer.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#666;"><p>Loading book...</p></div>';
        }
      } catch (e) {}

      chapters = payload.chapters || [];
      hrefs = payload.hrefs || [];
      if (payload.language) {
        try { document.body.setAttribute('lang', payload.language); } catch (e) {}
      }
      try {
        var style = document.createElement('style');
        style.textContent = '#viewer { display:block; width:100%; position:relative; } #viewer > * { display:block !important; visibility:visible !important; opacity:1 !important; position:static !important; } #viewer p, #viewer div, #viewer span { margin:0 0 1.1em 0; line-height:1.7; } #viewer img { max-width:100%; height:auto; display:block; } #viewer h1,#viewer h2,#viewer h3,#viewer h4 { margin:0.8em 0 0.4em; }';
        document.head.appendChild(style);
      } catch (e) {}
      renderChapter(payload.start || 0);
    } catch (e) {
      post({ type: 'error', message: 'init: ' + e.message });
      state = 'error';
    }
  }

  function next() {
    if (current + 1 < chapters.length) renderChapter(current + 1);
  }

  function prev() {
    if (current > 0) renderChapter(current - 1);
  }

  function gotoChapter(input) {
    var index = -1;
    if (typeof input === 'number') {
      index = input;
    } else if (typeof input === 'string' && hrefs.length) {
      var found = hrefs.indexOf(input);
      if (found < 0 && input.indexOf('#') >= 0) {
        found = hrefs.indexOf(input.split('#')[0]);
      }
      if (found >= 0) index = found;
    }
    if (index >= 0 && index < chapters.length) renderChapter(index);
  }

  function applySettings(s) {
    var theme = s.theme === 'dark' ? '#1c1c1e' : s.theme === 'sepia' ? '#f7ecd9' : '#ffffff';
    var fg = s.theme === 'dark' ? '#d8d8d8' : s.theme === 'sepia' ? '#5b4636' : '#1c1c1e';
    document.body.style.backgroundColor = theme;
    document.body.style.color = fg;
    if (s.language === 'bengali' || s.language === 'bn') {
      document.body.style.fontFamily = '"' + s.fontFamily + '", "Noto Sans Bengali", sans-serif';
    } else {
      document.body.style.fontFamily = '"' + s.fontFamily + '", "Noto Sans", "Georgia", serif';
    }
    document.body.style.fontSize = s.fontSize + 'px';
    document.body.style.lineHeight = String(s.lineHeight);
    document.body.style.padding = [12, 44, 76][s.margin || 1] + 'px';
    document.body.style.wordBreak = 'break-word';
  }

  // Self-healing: retry finding container if missing.
  function retryFind() {
    if (state === 'ready' || state === 'error') return;
    if (!findContainer()) {
      setTimeout(retryFind, 200);
    } else {
      post({ type: 'containerReady' });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', retryFind);
  } else {
    retryFind();
  }

  window.__boipoka = {
    init: init,
    next: next,
    prev: prev,
    gotoChapter: gotoChapter,
    applySettings: applySettings,
  };

  post({ type: 'webReady' });
})();
</script>
</body>
</html>
